# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Reviews run through the CodeRabbit GitHub App, which is free for public
# repositories. Install it once at https://github.com/apps/coderabbitai —
# no workflow file and no API key are involved.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # a release lands as a stack of pull requests that target a release branch or
    # each other rather than the default branch; without this CodeRabbit skips
    # every one of them and reports "reviews are disabled for this base branch"
    base_branches:
      - 'feat/.*'
      - 'release/.*'

  path_filters:
    - '!**/__pycache__/**'
    - '!dist/**'

  pre_merge_checks:
    # the built-in check counts every definition in the pull request, and the schema
    # gives it `mode` and `threshold` only — there is no way to scope it to a path.
    # Unscoped it measures test naming: `tests/` holds ~576 undocumented definitions,
    # almost all two-line fakes inside test bodies, and `pyproject.toml` ignores `D`
    # there on purpose — "test names are the documentation". So the 80% it reported was
    # a number about the suite's style, and the only way to satisfy it was to pad the
    # suite. Replaced below by the same question asked about `src/`, where the answer
    # means something. Do not narrow this with `path_filters`: those drive a sparse
    # checkout, so excluding `tests/` would take them out of review entirely.
    docstrings:
      # quoted: YAML 1.1 reads a bare `off` as the boolean false, and the schema wants
      # one of the strings off/warning/error — so unquoted it is a config error, silently
      mode: 'off'

    custom_checks:
      - name: Docstrings in src
        mode: warning
        instructions: >-
          Consider only files under src/. Every module, class, function and
          method there must have a docstring, including nested functions and
          private helpers — those two categories are invisible to ruff's
          pydocstyle rules and were the entire gap when this check was written.
          Ignore everything under tests/: that exclusion is deliberate and
          recorded in pyproject.toml. A docstring that only restates the name is
          a finding, not a pass — and that judgement is the half asked of you
          here. tests/test_docstring_coverage.py already fails CI for a missing
          docstring and for the degenerate restatement, where every word of the
          summary is filler or a word of the name; it cannot judge whether a
          longer docstring earns its length, which is why you are asked.

  path_instructions:
    - path: 'src/django_redis_aiogram/**'
      instructions: >-
        This is a Django library that runs aiogram in a separate container and
        queues Telegram messages through Redis. Weigh these first:

        - Import-time side effects. The package must stay importable, and
          Django must boot, with no token and no reachable Redis. Anything
          that connects or validates credentials belongs behind a property or
          a function, never at module level.
        - Thread safety. The delivery consumer runs in its own thread while
          the event loop belongs to the polling thread. create_task must never
          cross that boundary.
        - Serialization. Queued payloads must round-trip to the same concrete
          types. Discriminated unions such as InputMediaPhoto are the trap:
          dropping unset fields turns one into an InputMediaAudio silently.
        - Production-only failures, such as a managed Redis refusing
          CONFIG SET, or a hardcoded database index.
        - Logging. Values belong in extra={...}, not interpolated into the
          message, and keys are prefixed to avoid LogRecord collisions.

        Skip style nits that ruff and mypy already enforce.

    - path: 'tests/**'
      instructions: >-
        Check that a test would actually fail if the behaviour it covers
        regressed. Flag assertions that hold regardless of the code under
        test.

chat:
  auto_reply: true
