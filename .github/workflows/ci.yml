name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --group dev 'django~=${{ matrix.django-version }}.0'
      - run: python -m pytest -q

  test-db:
    # the default run ignores tests/db, because tests.settings has no database
    # on purpose — proving the package boots without one is part of the suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --group dev
      - run: python -m pytest -q --ds=tests.db_settings tests/db

  test-floors:
    # CI otherwise installs the newest releases, so the declared minimums are
    # never exercised. Exact pins, not 5.2.* — that resolved to 5.2.16
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
          # the floor this repository documents: --group is PEP 735, which
          # pip understands from 25.1. Every other job runs the runner's own
          # pip, so CI still exercises the one contributors actually have
          pip-version: '25.1'
      - run: pip install -e . --group dev 'django==5.2.0' 'aiogram==3.30.0' 'redis==6.2.0'
      - run: python -m pytest -q

  integration:
    # fakeredis agrees with everything, so it cannot answer whether LMOVE exists,
    # whether CONFIG SET is refused, or whether FSM state survives a restart
    name: integration (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # both ends of the supported range against a real server. Running only
        # the latest is what let a broken redis floor ship: the unit suite uses
        # fakeredis, which has the aclose() that redis-py 5.0 lacked
        include:
          - deps: latest
            pins: ''
            image: redis:7
          - deps: floors
            pins: "'django==5.2.0' 'aiogram==3.30.0' 'redis==6.2.0'"
            image: redis:7
          # the fork most managed providers actually run. It answers the same
          # protocol, which is an assumption worth testing rather than assuming
          - deps: valkey
            pins: ''
            image: valkey/valkey:8
    services:
      redis:
        image: ${{ matrix.image }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --group dev ${{ matrix.pins }}
      - run: python -m pytest -q -m integration tests/integration
        env:
          DJANGO_REDIS_AIOGRAM_TEST_REDIS_URL: redis://localhost:6379/0

  smoke:
    # the unit suite imports from src/, so only an install can catch a packaging
    # mistake: a missing py.typed, a module left out of the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build
      - run: bash scripts/smoke_install.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel must carry the typing marker
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected_names = (
              'django_redis_aiogram/py.typed',
              'django_redis_aiogram/api.py',
              'django_redis_aiogram/migrations/0001_initial.py',
          )
          for expected in expected_names:
              assert expected in names, f'{expected} missing from {wheel}: {names}'
          # 3.0 removed the 1.x package name; shipping it again would be silent
          shim = [n for n in names if n == 'telegram_bot.py' or n.startswith('telegram_bot/')]
          assert not shim, f'the removed telegram_bot package is back in {wheel}: {shim}'
          print(f'{wheel} ships py.typed and not the 1.x name')
          EOF
