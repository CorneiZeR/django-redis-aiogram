name: Wiki

# The wiki is a separate git repository. Keeping its pages under docs/wiki
# means they are reviewed in pull requests with the code they describe, and
# published from the default branch only.

on:
  push:
    branches: [master]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # pushing to <repo>.wiki.git is governed by the contents scope; the
      # workflow-level read is not enough to publish
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # the push below uses an explicit token, so the checkout does not
          # need to leave a usable credential in .git/config
          persist-credentials: false

      - name: Publish docs/wiki to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          # the wiki is generated output; mirroring keeps deletions in sync
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'wiki already up to date'
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
