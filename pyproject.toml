[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "django-redis-aiogram"
dynamic = ["version"]
description = "Run aiogram in a neighbour container and send Telegram messages from Django through Redis"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksii Kolosiuk", email = "kolosyuk1@gmail.com" }]
keywords = ["django", "redis", "aiogram", "telegram", "bot", "docker"]
dependencies = [
    "django>=5.2",
    "redis>=6.2",
    "aiogram>=3.30",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Typing :: Typed",
]

[project.optional-dependencies]
# not a runtime dependency: redis-py parses the protocol in C when this is
# present. Worth it on a busy consumer, pointless on a web tier that only ever
# pushes, which is why it is opt-in rather than pulled in for everybody
hiredis = ["redis[hiredis]>=6.2"]


# a dependency group, not an extra: an extra is published in the wheel and shows
# up as `Provides-Extra: dev` for everyone installing the package, who has no use
# for our linters. Needs pip 25.1+ or uv
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "fakeredis>=2.26",
    "ruff>=0.9",
    "mypy>=1.14",
    # <6.1: 6.1.0 resolves every Self-returning QuerySet method to Any, so a plain
    # queryset.filter() trips no-any-return under strict. Manager methods are unaffected,
    # which is why only admin.py sees it. Lift the ceiling once upstream fixes it.
    "django-stubs[compatible-mypy]>=5.1,<6.1",
    # tests/test_docstring_coverage.py reads `.coderabbit.yaml`, and that file's meaning
    # turns on YAML's own rules: a bare `off` is the boolean false, so the review policy
    # can be silently invalid. Asserting on the text cannot tell an active setting from
    # the same words in a comment either. Test-time only; mypy runs on `src` alone
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/CorneiZeR/django-redis-aiogram"
Documentation = "https://github.com/CorneiZeR/django-redis-aiogram/wiki"
Changelog = "https://github.com/CorneiZeR/django-redis-aiogram/blob/master/CHANGELOG.md"
Issues = "https://github.com/CorneiZeR/django-redis-aiogram/issues"
Repository = "https://github.com/CorneiZeR/django-redis-aiogram"
Funding = "https://github.com/sponsors/CorneiZeR"

[tool.hatch.version]
path = "src/django_redis_aiogram/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_redis_aiogram"]

[tool.hatch.build.targets.sdist]
# hatchling searches for licence files by name, at any depth, whatever the anchoring
# in `license-files` — so a contributor with a `venv/` or a vendored dependency ships
# their LICENSE files inside ours. Measured: an untracked `_probe_dir/LICENSE` lands in
# the sdist while `_probe_dir/NOTES.txt` and `_probe_dir/COPYING` do not. CI builds from
# a clean checkout and never saw it. `License-File` metadata still names only ours.
#
# `**`, not `*`: one star stops at one level, and `venv/lib/python3.13/site-packages/x`
# is four deep — measured, with `*/LICENSE` a nested `_p/deep/LICENSE` still shipped
exclude = ["**/LICENSE"]
# docs/ and the contributor files travel with the sdist: a distribution nobody
# can review or rebuild from itself is only half a distribution
include = [
    "src",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "AGENTS.md",
    "LICENSE",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
# tests/db needs a database, and tests.settings deliberately has none; it runs
# as a second invocation with --ds=tests.db_settings
addopts = "--ignore=tests/db"
markers = [
    "integration: needs a real Redis; set DJANGO_REDIS_AIOGRAM_TEST_REDIS_URL to run",
]
# deliberately not a bare "error": that escalates ResourceWarning into
# PytestUnraisableExceptionWarning, whose attribution follows GC timing and so
# differs between the 3.10 and 3.14 legs — a manufactured flake, not a finding
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # incorrect-blank-line-before-class is incompatible with D211
    "D213",   # multi-line-summary-second-line is incompatible with D212
    "COM812", # trailing commas are the formatter's job
    "CPY001", # no per-file copyright headers; LICENSE covers the project
]

[tool.ruff.lint.isort]
known-first-party = ["django_redis_aiogram"]

[tool.ruff.lint.flake8-annotations]
# Any is unavoidable for **kwargs passthroughs into aiogram bot methods
allow-star-arg-any = true

[tool.ruff.lint.flake8-unused-arguments]
# Django's BaseCommand.handle(self, *args, **options) never uses *args
ignore-variadic-names = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point of a test
    "S105",    # hardcoded test secrets
    "S106",    # hardcoded test passwords
    "SLF001",  # tests reach into private members deliberately
    "PLR2004", # magic values in assertions
    "ANN",     # annotations are not required in tests
    "ARG",     # unused fixture and mock arguments
    "D",       # test names are the documentation
    "PLC0415", # importing inside a test body is how import-time behaviour is asserted
    "EM101",   # test doubles raise realistic errors inline
    "EM102",   # same: the message is test data, not a domain error
    "TRY003",  # same
    "N801",    # a stub named `session` mirrors the aiogram attribute it stands in for
    "BLE001",  # tests catch Exception in thread bodies to report what the thread raised
    "S108",    # /tmp literals are inert fixture data; nothing opens them
]

[tool.ruff.lint.flake8-quotes]
# must agree with format.quote-style, or Q000's fix and the formatter fight each other
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
