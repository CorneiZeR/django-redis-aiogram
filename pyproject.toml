[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-redis-aiogram"
dynamic = ["version"]
description = "Run aiogram in a neighbour container and send Telegram messages from Django through Redis"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksii Kolosiuk", email = "kolosyuk1@gmail.com" }]
keywords = ["django", "redis", "aiogram", "telegram", "bot", "docker"]
dependencies = [
    "django>=5.2",
    "redis>=5.0",
    "aiogram>=3.30",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "fakeredis>=2.26",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
]

[project.urls]
Homepage = "https://github.com/CorneiZeR/django-redis-aiogram"
Changelog = "https://github.com/CorneiZeR/django-redis-aiogram/blob/master/CHANGELOG.md"
Issues = "https://github.com/CorneiZeR/django-redis-aiogram/issues"

[tool.hatch.version]
path = "src/django_redis_aiogram/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_redis_aiogram"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
